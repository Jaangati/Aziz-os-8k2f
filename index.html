<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aziz OS</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--cream:#efe8db;--ink:#13291f;--green:#1d5c43;--sage:#8aa897;--red:#a02b2b;--muted:#7a7a72;--track:#ddd6c8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:28px 16px;max-width:1180px;margin:auto}
header{text-align:center;margin-bottom:20px}
h1{font-size:26px}
.sub{color:var(--muted);letter-spacing:3px;font-size:11px;text-transform:uppercase;margin-top:4px}
#top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;flex-wrap:wrap}
button.t{background:var(--green);color:#fff;border:0;padding:8px 14px;border-radius:8px;font-size:12.5px;cursor:pointer}
button.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(20,40,30,.07)}
.cream{background:var(--cream)}.white{background:var(--card)}
#today{grid-column:span 3}#money{grid-column:span 6}#obj{grid-column:span 3}#attn{grid-column:span 12}
h2{font-size:13px;letter-spacing:2px;margin-bottom:14px}
h3{font-size:12px;margin:12px 0 6px;color:var(--green)}
li{list-style:none;font-size:14px;margin:6px 0;cursor:pointer}
li.done{text-decoration:line-through;color:var(--muted)}
.row{display:flex;justify-content:space-between;font-size:14px;margin:9px 0;gap:8px}
.bar{height:6px;background:var(--track);border-radius:3px;margin:2px 0 10px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--green)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.rings{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ring{text-align:center;width:76px}
.ring svg{width:64px;height:64px}
.ring p{font-size:10.5px;margin-top:4px;line-height:1.25}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--red);color:#fff;font-size:12.5px;padding:10px 14px;border-radius:10px;box-shadow:0 3px 8px rgba(160,43,43,.35)}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10}
#lock .box{background:var(--card);padding:32px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.12);text-align:center;width:300px}
#lock input{width:100%;padding:10px;border:1px solid var(--track);border-radius:8px;margin:12px 0;font-size:15px}
#lock .err{color:var(--red);font-size:12px;margin-top:8px;min-height:14px}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:24px 12px}
#panel.open{display:flex}
#panel .box{background:var(--card);border-radius:16px;padding:22px;width:560px;max-width:100%}
#panel label{display:block;font-size:11px;margin:10px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
#panel input,#panel textarea{width:100%;padding:8px;border:1px solid var(--track);border-radius:8px;font-size:14px;font-family:inherit}
#panel textarea{min-height:60px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtns{display:flex;gap:8px;margin-top:16px}
@media(max-width:900px){#today,#money,#obj{grid-column:span 12}}
@media(max-width:560px){.prow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h1 style="font-size:20px">AZIZ OS</h1>
  <p class="sub">Private — enter password</p>
  <input type="password" id="pw" placeholder="Password" autofocus>
  <button class="t" onclick="unlock()">Unlock</button>
  <div class="err" id="err"></div>
</div></div>

<div id="top">
  <button class="t" onclick="openPanel()">✎ Edit</button>
  <button class="t ghost" onclick="exportData()">⬇ Export</button>
  <button class="t ghost" onclick="document.getElementById('file').click()">⬆ Import</button>
  <button class="t ghost" onclick="resetData()">↺ Reset</button>
  <input type="file" id="file" hidden accept=".json">
</div>

<div id="panel"><div class="box">
  <h2>EDIT DATA</h2>
  <div class="prow">
    <div><label>Salary</label><input id="f_salary" type="number"></div>
    <div><label>Rent</label><input id="f_rent" type="number"></div>
  </div>
  <div class="prow">
    <div><label>Savings / month</label><input id="f_sav" type="number"></div>
    <div><label>Investments / month</label><input id="f_inv" type="number"></div>
  </div>
  <div class="prow">
    <div><label>Tunisia fund / month</label><input id="f_tun" type="number"></div>
    <div><label>Total available cash</label><input id="f_cash" type="number"></div>
  </div>
  <label>Variable expenses (Name, amount)</label><textarea id="f_var"></textarea>
  <label>Top priority</label><input id="f_pri">
  <label>Top 3 actions (one per line)</label><textarea id="f_act"></textarea>
  <label>Objectives (Name, %)</label><textarea id="f_obj"></textarea>
  <label>Needs attention (one per line)</label><textarea id="f_attn"></textarea>
  <div class="pbtns">
    <button class="t" onclick="saveForm()">Save</button>
    <button class="t ghost" onclick="closePanel()">Cancel</button>
  </div>
</div></div>

<header>
  <h1>AZIZ OS — The CEO of My Life</h1>
  <p class="sub" id="date"></p>
</header>
<div class="grid">
  <section class="card cream" id="today">
    <h2>TODAY</h2>
    <h3>Top Priority</h3>
    <p id="priority" style="font-size:14px"></p>
    <h3>Top 3 Actions</h3>
    <ul id="actions"></ul>
  </section>
  <section class="card white" id="money">
    <h2>FINANCIAL COMMAND CENTER</h2>
    <div id="rows"></div>
    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card cream" id="obj">
    <h2>CURRENT OBJECTIVES</h2>
    <div class="rings" id="rings"></div>
  </section>
  <section class="card white" id="attn">
    <h2 style="color:var(--red)">NEEDS ATTENTION</h2>
    <div class="chips" id="chips"></div>
  </section>
</div>
<script>
/* ========== SETTINGS ========== */
const PASSWORD="aziz2026"; // ← change me
const DEFAULTS={
  salary:50000, rent:5900,
  variable:{Groceries:2400,Transport:700,"Dining out":1100,Utilities:650,Personal:900,"Family support":1500},
  savings:3000, investments:1000, tunisia:800, cash:42310,
  priority:"Finalize Tunisia business pitch deck",
  actions:["Review Q2 savings report","Schedule mentor call","Update personal KPI tracker"],
  objectives:[["Emergency Fund",82],["Cut Expenses",65],["Tunisia Fund",41],["Career Goal",73],["Personal Goal",55]],
  attention:["Kahramaa bill due Aug 12","Credit card payment","Lease renewal decision","Pitch deck deadline Aug 20","Tunisia research stalled"]
};
let DATA=load();
function load(){try{const d=JSON.parse(localStorage.getItem("azizData"));if(d&&d.salary)return d;}catch(e){}return JSON.parse(JSON.stringify(DEFAULTS));}
function persist(){localStorage.setItem("azizData",JSON.stringify(DATA));}
/* ========== LOCK ========== */
function unlock(){
  if(document.getElementById("pw").value===PASSWORD){localStorage.setItem("azizUnlocked","1");document.getElementById("lock").remove();init();}
  else document.getElementById("err").textContent="Wrong password";
}
if(localStorage.getItem("azizUnlocked")==="1"){document.getElementById("lock").remove();init();}
else document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
/* ========== EDIT PANEL ========== */
const g=id=>document.getElementById(id), num=id=>parseFloat(g(id).value)||0;
const lines=id=>g(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
function pairsObj(t){const o={};t.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{l=l.replace(":",",");const i=l.lastIndexOf(",");if(i<0)return;const k=l.slice(0,i).trim(),v=parseFloat(l.slice(i+1));if(k&&!isNaN(v))o[k]=v;});return o;}
function pairsArr(t){const a=[];t.split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{l=l.replace(":",",");const i=l.lastIndexOf(",");if(i<0)return;const k=l.slice(0,i).trim(),v=parseFloat(l.slice(i+1));if(k&&!isNaN(v))a.push([k,v]);});return a;}
function openPanel(){
  g("f_salary").value=DATA.salary;g("f_rent").value=DATA.rent;g("f_sav").value=DATA.savings;
  g("f_inv").value=DATA.investments;g("f_tun").value=DATA.tunisia;g("f_cash").value=DATA.cash;
  g("f_var").value=Object.entries(DATA.variable).map(e=>e[0]+", "+e[1]).join("\n");
  g("f_pri").value=DATA.priority; g("f_act").value=DATA.actions.join("\n");
  g("f_obj").value=DATA.objectives.map(o=>o[0]+", "+o[1]).join("\n");
  g("f_attn").value=DATA.attention.join("\n");
  g("panel").classList.add("open");
}
function closePanel(){g("panel").classList.remove("open");}
function saveForm(){
  DATA.salary=num("f_salary");DATA.rent=num("f_rent");DATA.savings=num("f_sav");
  DATA.investments=num("f_inv");DATA.tunisia=num("f_tun");DATA.cash=num("f_cash");
  DATA.variable=pairsObj(g("f_var").value);
  DATA.priority=g("f_pri").value.trim()||DATA.priority;
  DATA.actions=lines("f_act"); DATA.objectives=pairsArr(g("f_obj").value); DATA.attention=lines("f_attn");
  persist(); closePanel(); init();
}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,1)],{type:"application/json"}));a.download="aziz-os-backup.json";a.click();}
function resetData(){if(confirm("Reset to dummy data?")){localStorage.removeItem("azizData");DATA=JSON.parse(JSON.stringify(DEFAULTS));init();}}
g("file").addEventListener("change",e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.salary){DATA=d;persist();init();}}catch(_){alert("Invalid backup file")}};r.readAsText(e.target.files[0]);e.target.value="";});
/* ========== ENGINE ========== */
function init(){
const q=s=>document.querySelector(s), fmt=n=>"QAR "+n.toLocaleString();
q("#date").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).toUpperCase();
q("#priority").textContent=DATA.priority;
q("#actions").innerHTML=DATA.actions.map(a=>`<li>○ ${a}</li>`).join("");
q("#actions").onclick=e=>{if(e.target.tagName==="LI"){e.target.classList.toggle("done");e.target.textContent=(e.target.classList.contains("done")?"✓ ":"○ ")+e.target.textContent.slice(2);}};
const varTotal=Object.values(DATA.variable).reduce((a,b)=>a+b,0);
const saved=DATA.savings+DATA.investments+DATA.tunisia;
const left=DATA.salary-DATA.rent-varTotal-saved;
const rate=(saved/DATA.salary*100).toFixed(1);
q("#rows").innerHTML=[
 ["Salary",fmt(DATA.salary),100],["Rent",fmt(DATA.rent)],["Variable expenses",fmt(varTotal)],
 ["Savings + Investments + Tunisia",fmt(saved)],["Left over this month",fmt(left)],
 ["Total available cash",fmt(DATA.cash)],["Savings rate",rate+"%",rate]
].map(r=>`<div class="row"><span>${r[0]}:</span><b>${r[1]}</b></div>${r[2]?`<div class="bar"><i style="width:${r[2]}%"></i></div>`:""}`).join("");
q("#stack").innerHTML=[["Rent",DATA.rent,"#1d5c43"],["Variable",varTotal,"#8aa897"],["Saved",saved,"#3f7a5e"],["Left",left,"#ddd6c8"]]
 .map(s=>`<i style="width:${Math.max(s[1]/DATA.salary*100,0)}%;background:${s[2]}" title="${s[0]}"></i>`).join("");
q("#legend").innerHTML=[["Rent","#1d5c43"],["Variable","#8aa897"],["Saved","#3f7a5e"],["Left over","#ddd6c8"]]
 .map(l=>`<span><span class="dot" style="background:${l[1]}"></span>${l[0]}</span>`).join("");
q("#rings").innerHTML=DATA.objectives.map(o=>{const r=26,c=2*Math.PI*r;
 return `<div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#d8d2c4" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="#1d5c43" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*o[1]/100} ${c}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#13291f">${o[1]}%</text></svg><p>${o[0]}</p></div>`}).join("");
q("#chips").innerHTML=DATA.attention.map(a=>`<div class="chip">${a}</div>`).join("");
}
</script>
</body>
</html>
